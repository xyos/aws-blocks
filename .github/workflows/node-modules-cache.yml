name: node_modules cache

# Saves node_modules on main for the current lockfile, so PR Checks jobs
# restore it (.github/actions/npm-install) instead of running npm ci. A cache
# saved on the default branch is readable from every PR; one a PR saves is
# readable only from that PR, so PRs never save. Runs on every push: when the
# entry for this lockfile already exists it only looks it up (seconds), and
# when it was evicted it saves it again.

on:
  push:
    # ciexp (fork-only): also ciexp-base, the base branch of the fork's experiment PRs.
    branches: [main, ciexp-base]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-modules-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  save:
    name: Save node_modules (${{ matrix.runner }})
    strategy:
      matrix:
        # The runners PR Checks restores it on.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/npm-install
        with:
          save: 'true'
