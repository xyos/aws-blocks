name: node_modules cache

# Saves node_modules on main for the current lockfile, so PR Checks jobs
# restore it (.github/actions/npm-install) instead of running npm ci. A cache
# saved on the default branch is readable from every PR; one a PR saves is
# readable only from that PR, so PRs never save. Runs on every push: when the
# entry for this lockfile already exists it only looks it up (seconds), and
# when it was evicted it saves it again.

on:
  push:
    # ciexp (fork-only): also ciexp-base, the base branch of the fork's experiment PRs.
    branches: [main, ciexp-base]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: node-modules-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  save:
    name: Save node_modules (${{ matrix.runner }})
    strategy:
      matrix:
        # The runners PR Checks restores it on.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/npm-install
        with:
          save: 'true'

  # Windows jobs (E2E Templates (Windows)) keep npm ci, with setup-node's npm
  # download cache. Without an entry on main, each PR's first Windows run
  # misses and saves its own ~650 MB entry, which pushes the shared 10 GB cache
  # into evicting the Linux entries. This saves one on main for PRs to read.
  windows-npm:
    name: Save the npm cache (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Restores the entry when it exists (no save then), else saves it after
      # npm ci fills the npm cache.
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - if: steps.node.outputs.cache-hit != 'true'
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
